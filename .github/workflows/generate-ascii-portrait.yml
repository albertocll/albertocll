name: Generar retrato ASCII

on:
  push:
    paths:
      - 'perfil/profile.jpg'
  workflow_dispatch:

jobs:
  ascii-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar ascii-image-converter
        run: go install github.com/TheZoraiz/ascii-image-converter@latest

      - name: Generar arte ASCII a partir de perfil/profile.jpg
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/ascii-image-converter" perfil/profile.jpg --width 60 -C > ascii_output.txt

      - name: Insertar el resultado en README.md
        run: |
          python3 - <<'EOF'
          import re

          with open('ascii_output.txt') as f:
              art = f.read()

          with open('README.md') as f:
              readme = f.read()

          block = "<!-- ASCII_PORTRAIT:START -->\n<pre>\n" + art + "</pre>\n<!-- ASCII_PORTRAIT:END -->"

          new_readme = re.sub(
              r'<!-- ASCII_PORTRAIT:START -->.*?<!-- ASCII_PORTRAIT:END -->',
              lambda m: block,
              readme,
              flags=re.DOTALL,
          )

          with open('README.md', 'w') as f:
              f.write(new_readme)
          EOF

      - name: Commit del README actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar retrato ASCII generado automaticamente"
          file_pattern: README.md
